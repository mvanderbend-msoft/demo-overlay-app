name: Bug report
description: Something broken or behaving unexpectedly in the overlay
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I press Ctrl+Alt+→ the overlay flickers and disappears.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The overlay should advance to the next section without flickering.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start
        2. Press Ctrl+Alt+→
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system + version
      placeholder: Windows 11 23H2 / macOS 14.4 / Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node + Electron version
      description: Output of `node --version` and `npx electron --version`.
      placeholder: node v20.11.0, electron v32.0.0
  - type: textarea
    id: logs
    attributes:
      label: Console logs
      description: Anything from the terminal where you ran `npm start`, or DevTools console.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, clips, or anything else
