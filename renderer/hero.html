<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hero</title>
  <link rel="stylesheet" href="hero.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="rays"></div>
    <div class="confetti" id="confetti"></div>

    <div class="badge">
      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-3"></div>

      <div class="ring">
        <svg viewBox="0 0 220 220" class="ring-svg">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#c9a4ff"/>
              <stop offset="50%" stop-color="#8957e5"/>
              <stop offset="100%" stop-color="#1f6feb"/>
            </linearGradient>
            <linearGradient id="ringGrad2" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffd166"/>
              <stop offset="100%" stop-color="#ff9f1c"/>
            </linearGradient>
          </defs>
          <circle cx="110" cy="110" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.85"/>
          <circle cx="110" cy="110" r="86" fill="none" stroke="url(#ringGrad2)" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/>
        </svg>
      </div>

      <div class="medal">
        <div class="medal-inner">
          <div class="star">★</div>
          <div class="medal-text">HERO</div>
        </div>
      </div>

      <div class="rays-burst"></div>
    </div>

    <div class="title-block">
      <div class="eyebrow" id="heroEyebrow">CONGRATULATIONS</div>
      <h1 class="title" id="heroTitle">You are now a <span class="grad">Hero</span></h1>
      <div class="subtitle" id="heroSubtitle">GitHub Copilot · Zero-To-Hero · Complete</div>
    </div>

    <div class="hint">Ctrl+Alt+Enter to dismiss</div>
  </div>
  <script src="hero.js"></script>
</body>
</html>
